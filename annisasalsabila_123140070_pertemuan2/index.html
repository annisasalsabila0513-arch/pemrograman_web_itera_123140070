<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JadwalKu | Jadwal Kuliah Mingguan</title>
  <meta name="description" content="Dashboard jadwal kuliah mingguan untuk mahasiswa: kelas berikutnya, deteksi bentrok, cuaca kampus ITERA, dan kutipan harian.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page">
    <header class="top">
      <div>
        <h1 id="greeting">Selamat datang</h1>
        <p id="today" class="muted"></p>
      </div>
      <p class="brand">JadwalKu</p>
    </header>

    <p id="storageNotice" class="notice" role="alert" hidden>
      Data tidak bisa disimpan ke penyimpanan browser. Perubahan akan hilang saat halaman ditutup.
    </p>

    <div class="layout">
      <main class="main">
        <section id="nextClass" class="next" aria-live="polite"></section>

        <section class="panel" aria-labelledby="formTitle">
          <h2 id="formTitle">Tambah kelas</h2>
          <form id="classForm" class="form" novalidate>
            <div class="field field--wide">
              <label for="course">Mata kuliah</label>
              <input id="course" name="course" type="text" maxlength="80" list="courseList" autocomplete="off" placeholder="Contoh: Pengembangan Aplikasi Web" required>
              <datalist id="courseList"></datalist>
            </div>
            <div class="field">
              <label for="type">Jenis</label>
              <select id="type" name="type"></select>
            </div>
            <div class="field">
              <label for="day">Hari</label>
              <select id="day" name="day"></select>
            </div>
            <div class="field">
              <label for="start">Jam mulai</label>
              <input id="start" name="start" type="time" required>
            </div>
            <div class="field">
              <label for="end">Jam selesai</label>
              <input id="end" name="end" type="time" required>
            </div>
            <div class="field">
              <label for="room">Ruang</label>
              <input id="room" name="room" type="text" maxlength="60" autocomplete="off" placeholder="Opsional">
            </div>
            <div class="field">
              <label for="lecturer">Dosen pengampu</label>
              <input id="lecturer" name="lecturer" type="text" maxlength="80" autocomplete="off" placeholder="Opsional">
            </div>
            <div class="form__actions">
              <button type="submit" id="submitBtn" class="btn btn--primary">Tambah kelas</button>
              <button type="button" id="cancelBtn" class="btn btn--ghost" hidden>Batal</button>
              <p id="formError" class="form__error" role="alert"></p>
            </div>
          </form>
        </section>

        <section class="panel panel--list" aria-labelledby="listTitle">
          <div class="panel__head panel__head--wrap">
            <h2 id="listTitle">Jadwal</h2>
            <div class="toolbar">
              <div class="search">
                <label for="searchInput" class="sr-only">Cari jadwal</label>
                <input id="searchInput" type="search" placeholder="Cari mata kuliah, ruang, atau dosen" autocomplete="off">
              </div>
              <div class="sort">
                <label for="typeFilter" class="sr-only">Filter jenis kelas</label>
                <select id="typeFilter"></select>
              </div>
            </div>
          </div>

          <div class="list-controls">
            <div id="views" class="segmented" role="group" aria-label="Rentang jadwal"></div>
          </div>

          <div id="schedule" aria-live="polite"></div>
          <p id="listSummary" class="muted small list-summary"></p>
        </section>
      </main>

      <aside class="side" aria-label="Ringkasan dan informasi">
        <section class="panel" aria-labelledby="summaryTitle">
          <h2 id="summaryTitle">Ringkasan pekan</h2>
          <div id="summary" class="summary"></div>
        </section>
        <section id="weather" class="panel" aria-live="polite"></section>
        <section id="quote" class="panel" aria-live="polite"></section>
      </aside>
    </div>

    <footer class="foot">
      <p>Annisa Salsabila (123140070). Praktikum Pengembangan Aplikasi Web, Teknik Informatika ITERA.</p>
    </footer>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- type="module" wajib agar import/export ES6 berjalan di browser -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
